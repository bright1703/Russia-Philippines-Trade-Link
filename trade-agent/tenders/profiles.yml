# Профили направлений, потенциально интересных компаниям Приморского края.
#
# Поля профиля:
#   id, name          — идентификатор и название направления
#   keywords          — ключевые слова (нижний регистр, ищутся как слова/подстроки)
#   strong_keywords   — слова, дающие повышенный вес (прямое попадание)
#   exclude_keywords  — слова, при которых профиль не применяется
#   company_types     — типы российских компаний, которым это направление подходит
#   base_weight       — базовый коэффициент релевантности (0.0 – 1.0)

